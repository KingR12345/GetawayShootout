server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the pre-compressed copies built into the image.
    gzip_static on;

    # Compress the small text assets on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Unity payloads are large and change only on redeploy.
    location /Build/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html points at everything else, so it must not go stale.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
